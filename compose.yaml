services:
  postgres:
    image: docker.m.daocloud.io/library/postgres:15-alpine
    container_name: newapi-analysis-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: root
      POSTGRES_DB: newapi_analysis
      PGTZ: Asia/Shanghai
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d newapi_analysis"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pg_data:
